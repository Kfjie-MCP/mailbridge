name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python upstream/tests/test_mailbridge.py
      - run: python tests/test_newest_first.py
      - run: python -m compileall -q deploy
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci && npm run check
        working-directory: gateway
