location = /mailbridge/mcp {
    proxy_pass http://127.0.0.1:18760/mcp;
    include /etc/nginx/snippets/mcp-streamable-http.conf;
}

location = /mailbridge/mcp/ {
    proxy_pass http://127.0.0.1:18760/mcp;
    include /etc/nginx/snippets/mcp-streamable-http.conf;
}

location = /mailbridge/healthz {
    proxy_pass http://127.0.0.1:18760/healthz;
    proxy_set_header Host $host;
}
