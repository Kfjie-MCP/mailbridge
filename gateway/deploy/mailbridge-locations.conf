location = /mailbridge/mcp {
    proxy_pass http://127.0.0.1:4204/mailbridge/mcp;
    include /etc/nginx/snippets/mcp-streamable-http.conf;
}

location = /mailbridge/mcp/ {
    proxy_pass http://127.0.0.1:4204/mailbridge/mcp;
    include /etc/nginx/snippets/mcp-streamable-http.conf;
}

location ^~ /mailbridge/oauth/ {
    proxy_pass http://127.0.0.1:4204;
    include /etc/nginx/snippets/mcp-streamable-http.conf;
    access_log off;
}

location = /.well-known/oauth-protected-resource/mailbridge/mcp {
    proxy_pass http://127.0.0.1:4204;
}

location = /.well-known/oauth-authorization-server/mailbridge {
    proxy_pass http://127.0.0.1:4204;
}

location = /mailbridge/healthz {
    proxy_pass http://127.0.0.1:18760/healthz;
    proxy_set_header Host $host;
}
